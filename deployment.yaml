apiVersion: apps/v1
kind: Deployment

metadata:
  name: banking-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: banking-app

  template:
    metadata:
      labels:
        app: banking-app

    spec:
      containers:
      - name: banking-app

        image: shinushiju/banking-app:v1

        ports:
        - containerPort: 5000 


